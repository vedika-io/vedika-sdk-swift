name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build (macOS)
        run: swift build
      - name: Test (macOS)
        run: swift test
      - name: Build for iOS devices
        run: >
          xcodebuild build -scheme VedikaSDK
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  pod-lib-lint:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: pod --version && swift --version && xcodebuild -version
      - name: Lint the podspec
        run: |
          set -o pipefail
          pod lib lint VedikaSDK.podspec 2>&1 | tee pod-lib-lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pod-lib-lint
          path: pod-lib-lint.log
